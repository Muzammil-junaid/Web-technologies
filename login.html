<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Clone - Log in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <a href="index.html" class="logo"><span class="logo-dot">♫</span> Spotify Clone</a>
  <div class="auth-card">
    <div class="auth-tabs" role="tablist">
      <button type="button" class="auth-tab active" data-mode="login" role="tab">Log in</button>
      <button type="button" class="auth-tab" data-mode="signup" role="tab">Sign up</button>
    </div>
    <h1 id="authTitle">Log in to Spotify Clone</h1>
    <a href="#" class="btn btn-outline social-btn">🌐 Continue with Google</a>
    <a href="#" class="btn btn-outline social-btn">📘 Continue with Facebook</a>
    <div class="divider">or</div>
    <form id="authForm" novalidate>
      <div class="field signup-only hidden">
        <label for="name">Your name</label>
        <input id="name" type="text" placeholder="Muzammil" autocomplete="name">
        <div class="msg"></div>
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
        <div class="msg"></div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="At least 6 characters" autocomplete="current-password">
        <div class="msg"></div>
      </div>
      <button type="submit" class="btn btn-green" id="authSubmit">Log in</button>
    </form>
    <p class="auth-foot" id="authFoot"></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
